name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          listing=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit no
          set net:max-retries 4
          set net:timeout 20
          set ftp:passive-mode true
          set ftp:ssl-allow no
          cls -1
          bye
          EOF
          )
          echo "FTP root listing:"
          echo "$listing"
          echo "$listing" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=FTP root::$line"
          done
          printf 'public_html' > /tmp/wx-probe-public-html.txt
          printf 'domains' > /tmp/wx-probe-domains.txt
          printf 'root' > /tmp/wx-probe-root.txt

          upload_probe() {
            local remote_dir="$1"
            local file_name="$2"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF || true
          set cmd:fail-exit no
          set net:max-retries 5
          set net:reconnect-interval-base 4
          set net:timeout 25
          set ftp:passive-mode true
          set ftp:ssl-allow no
          mkdir -p -f "$remote_dir"
          put -O "$remote_dir" "/tmp/$file_name"
          bye
          EOF
          }

          upload_probe "public_html" "wx-probe-public-html.txt"
          upload_probe "domains/webologyx.com/public_html" "wx-probe-domains.txt"
          upload_probe "." "wx-probe-root.txt"

          sleep 5
          TARGET=""
          if curl -fsS "https://webologyx.com/wx-probe-root.txt" | grep -q root; then
            TARGET="."
          fi
          if curl -fsS "https://webologyx.com/wx-probe-public-html.txt" | grep -q public_html; then
            TARGET="public_html"
          fi
          if curl -fsS "https://webologyx.com/wx-probe-domains.txt" | grep -q domains; then
            TARGET="domains/webologyx.com/public_html"
          fi

          echo "Live folder: ${TARGET:-not found}"
          if [ -z "$TARGET" ]; then
            echo "The built site was not visible from any Hostinger folder."
            exit 1
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:timeout 40
          set ftp:passive-mode true
          set ftp:ssl-allow no
          lcd out
          cd "$TARGET"
          mirror -R --delete --continue --verbose --parallel=2 .
          bye
          EOF
